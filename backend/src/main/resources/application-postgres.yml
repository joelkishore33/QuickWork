spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:quickwork}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:quickwork}
    password: ${DB_PASSWORD:quickwork}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  h2:
    console:
      enabled: false

quickwork:
  seed-demo-data: ${SEED_DEMO_DATA:false}
